<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mis solicitudes</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    [hidden] { display: none !important; }
    .bloque { margin-bottom: 28px; }
    .filtros { display: flex; flex-wrap: wrap; gap: 10px; }
    .filtros .separar { margin-left: auto; }
  </style>
  <script src="../js/funcionesMisSolicitudes.js" defer></script>
</head>
<body>
  <main class="contenido contenido-estrecho">

    <!-- Cabecera -->
    <header class="cabecera-pagina bloque">
      <div>
        <h1>Mis solicitudes</h1>
      </div>
      <button id="btn-salir" class="boton secundario" type="button">Salir</button>
    </header>

    <!-- Acciones -->
    <section class="bloque">
      <p class="aviso" style="margin-bottom:18px">
        Las solicitudes se crean y se editan en GitHub. Para editar una, ábrela y pulsa ··· → Edit.
      </p>

      <div class="filtros">
        <button id="btn-nueva" class="boton" type="button">+ Nueva solicitud</button>
        <button id="btn-mis-github" class="boton secundario" type="button">Ver y editar mis solicitudes</button>
        <!-- Solo lo ve el admin (lo muestra el JS) -->
        <a id="enlace-admin" class="boton fantasma separar" href="panelAdmin.html" hidden>Administración</a>
      </div>
    </section>

  </main>
</body>
</html>
